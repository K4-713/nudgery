# Robolectric runs these tests against the Android 15 (API 35) framework rather than the app's
# targetSdk. Its API 36 sandbox requires Java 21, and the build currently runs on Java 17 — pinning
# here keeps the alarm/scheduling/notification tests running in `./gradlew build` instead of
# failing to start a sandbox.
#
# Remove this pin once the Gradle JVM moves to 21 (see TODO.md → Toolchain / Dependency Currency),
# so the tests exercise the same API level the app targets.
sdk=35

# Use a plain Application rather than NudgeryApplication. The real one calls startKoin() in
# onCreate, and Robolectric builds a fresh Application per test while Koin's GlobalContext is static
# for the whole JVM — so the second test in a run would hit KoinApplicationAlreadyStartedException.
# Each test that needs Koin starts and stops its own, which is what they already did on-device.
application=android.app.Application
